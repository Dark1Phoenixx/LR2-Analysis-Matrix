name: Matrix testing

on:
  push:
    branches: [main, develop, lab4-testing]
    tags: ['v1.2.*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Inspect code with Flake8
        run: python -m flake8 src tests --max-line-length=120
      - name: Run regression suite
        run: python -m unittest discover -s tests -p test_regression.py -v
      - name: Run all tests and measure coverage
        run: |
          python -m coverage erase
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage combine
          python -m coverage report --fail-under=75
          python -m coverage json
          python -c "import json; assert json.load(open('coverage.json', encoding='utf-8'))['totals']['percent_statements_covered'] >= 75"
          python -m coverage xml
      - name: Save coverage report
        uses: actions/upload-artifact@v4
        with:
          name: matrix-coverage
          path: coverage.xml
