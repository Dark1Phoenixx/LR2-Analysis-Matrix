name: Integration

on:
  push:
    branches: [main, develop]
    tags: ["v1.1.*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install coverage flake8
      - run: flake8 src tests --max-line-length=120
      - run: coverage run -m unittest discover -s tests -v
      - run: coverage combine
      - run: coverage report -m

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Package project
        run: zip -r matrix-analysis-lr3.zip README.md src tests examples docs .github .gitignore
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: matrix-analysis-lr3.zip
